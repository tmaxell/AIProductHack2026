<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Project Launch Copilot — локальный просмотрщик</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 0; padding: 24px; background: #0f1115; color: #e6e6e6; }
  h1 { font-size: 20px; }
  h2 { font-size: 16px; margin-top: 28px; border-bottom: 1px solid #333; padding-bottom: 6px; }
  h3 { font-size: 14px; color: #9ecbff; }
  section { margin-bottom: 24px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; margin-bottom: 12px; }
  th, td { border: 1px solid #2a2d34; padding: 4px 8px; text-align: left; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  th { background: #1a1d24; position: sticky; top: 0; }
  tr:nth-child(even) td { background: #14161b; }
  .log-entry { margin: 6px 0; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { padding: 4px 10px; border: 1px solid #333; border-radius: 6px; cursor: pointer; background: #1a1d24; }
  .tab.active { background: #2a5db0; border-color: #2a5db0; }
  .table-wrap { max-height: 480px; overflow: auto; border: 1px solid #2a2d34; }
  .muted { color: #888; font-size: 12px; }
</style>
</head>
<body>
  <h1>Project Launch Copilot — результат локального прогона</h1>

  <section id="log-section">
    <h2>Лог вывода (output.*) за прогон</h2>
    <div id="log"></div>
  </section>

  <section id="tables-section">
    <h2>Таблицы после прогона</h2>
    <div class="tabs" id="tabs"></div>
    <div id="table-container"></div>
  </section>

  <script>
    async function main() {
      const res = await fetch('/local-run-output.json');
      const data = await res.json();
      renderLog(data.output || []);
      renderTables(data.seed && data.seed.datasheets || {});
    }

    function mdToHtml(s) {
      return s
        .split('\n')
        .map((line) => {
          if (line.startsWith('### ')) return '<h3>' + escapeHtml(line.slice(4)) + '</h3>';
          if (line.startsWith('## ')) return '<h2 style="border:none;margin-top:8px">' + escapeHtml(line.slice(3)) + '</h2>';
          if (line.startsWith('# ')) return '<h1>' + escapeHtml(line.slice(2)) + '</h1>';
          if (line.startsWith('- ')) return '<div>&nbsp;&nbsp;• ' + escapeHtml(line.slice(2)) + '</div>';
          return '<div>' + escapeHtml(line) + '</div>';
        })
        .join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    }

    function renderLog(entries) {
      const el = document.getElementById('log');
      if (!entries.length) { el.innerHTML = '<p class="muted">Лог пуст — запустите run-local.js с флагом --html.</p>'; return; }
      el.innerHTML = entries.map((e) => {
        if (e.type === 'text') return '<div class="log-entry">' + escapeHtml(e.content) + '</div>';
        if (e.type === 'markdown') return '<div class="log-entry">' + mdToHtml(e.content) + '</div>';
        if (e.type === 'table') return '<div class="log-entry">' + renderInlineTable(e.rows) + '</div>';
        if (e.type === 'clear') return '<hr/>';
        return '';
      }).join('');
    }

    function renderInlineTable(rows) {
      if (!rows || !rows.length) return '<p class="muted">(пустая таблица)</p>';
      const cols = Object.keys(rows[0]);
      let html = '<div class="table-wrap"><table><thead><tr>' + cols.map((c) => '<th>' + escapeHtml(c) + '</th>').join('') + '</tr></thead><tbody>';
      for (const r of rows) {
        html += '<tr>' + cols.map((c) => '<td>' + escapeHtml(r[c] === null || r[c] === undefined || r[c] === '' ? '—' : r[c]) + '</td>').join('') + '</tr>';
      }
      html += '</tbody></table></div>';
      return html;
    }

    function renderTables(datasheets) {
      const keys = Object.keys(datasheets);
      const tabs = document.getElementById('tabs');
      const container = document.getElementById('table-container');
      tabs.innerHTML = keys.map((k, i) => '<div class="tab' + (i === 0 ? ' active' : '') + '" data-key="' + k + '">' + datasheets[k].name + ' (' + datasheets[k].records.length + ')</div>').join('');

      function show(key) {
        [...tabs.children].forEach((t) => t.classList.toggle('active', t.dataset.key === key));
        const ds = datasheets[key];
        const fields = ds.fields.map((f) => f.name);
        const LIMIT = 300;
        const rows = ds.records.slice(0, LIMIT);
        let html = '';
        if (ds.records.length > LIMIT) html += '<p class="muted">Показаны первые ' + LIMIT + ' из ' + ds.records.length + ' записей.</p>';
        html += '<div class="table-wrap"><table><thead><tr><th>id</th>' + fields.map((f) => '<th>' + escapeHtml(f) + '</th>').join('') + '</tr></thead><tbody>';
        for (const r of rows) {
          html += '<tr><td>' + escapeHtml(r.id) + '</td>' + fields.map((f) => {
            const v = r.cells ? r.cells[f] : r[f];
            return '<td>' + escapeHtml(v === null || v === undefined || v === '' ? '—' : v) + '</td>';
          }).join('') + '</tr>';
        }
        html += '</tbody></table></div>';
        container.innerHTML = html;
      }

      tabs.addEventListener('click', (e) => {
        const key = e.target.dataset.key;
        if (key) show(key);
      });

      if (keys.length) show(keys[0]);
    }

    main().catch((err) => {
      document.body.innerHTML += '<p style="color:#f77">Ошибка загрузки: ' + err.message + '</p>';
    });
  </script>
</body>
</html>
